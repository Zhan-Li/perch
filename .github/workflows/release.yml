name: Release

# Push a tag to publish a release:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `inputs.version` is caller-supplied text. Expanding it with ${{ }}
      # substitutes it into the script *before* the shell sees it, so a crafted
      # version string runs arbitrary commands in the job that holds the signing
      # key. Pass it through the environment and quote it instead. The character
      # check then rejects anything that is not a version, which also stops an
      # embedded newline from forging extra step outputs.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VALUE="$INPUT_VERSION"
          else
            VALUE="${GITHUB_REF_NAME#v}"
          fi

          case "$VALUE" in
            ""|*[!0-9.]*) echo "::error::refusing to build version '$VALUE'"; exit 1 ;;
          esac

          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      # The signing secrets are mapped per step rather than at job level, so the
      # private key is never in the environment of `checkout`, `upload-artifact`
      # or the version step — a compromised third-party action cannot read what
      # was never put in its scope. This flag lets the later steps branch on
      # whether a certificate exists without holding the certificate itself.
      - name: Detect signing certificate
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no signing certificate configured; build will be ad-hoc"
          fi

      # Optional: set these three repository secrets to ship a signed and
      # notarised build. Without them the DMG is still produced, but users must
      # right-click ▸ Open on first launch and re-grant Accessibility access
      # after each update, because an ad-hoc signature pins the code hash.
      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain

          # Stop the keychain relocking part way through a build. The default is
          # a five minute idle timeout, which a universal build can exceed.
          security set-keychain-settings -t 3600 -u build.keychain

          # `default-keychain` only decides where new items are created; it does
          # not put the keychain on the *search* list, and both `codesign` and
          # build.sh's `find-certificate` probe only search it. Without this the
          # identity is invisible, build.sh quietly falls back to an ad-hoc
          # signature, and the release ships with a cdhash-pinned designated
          # requirement that revokes everyone's Accessibility grant.
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d ' "') build.keychain

          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k runner build.keychain >/dev/null
          rm -f /tmp/cert.p12

      - name: Build DMG
        env:
          PERCH_SIGN_IDENTITY: ${{ secrets.PERCH_SIGN_IDENTITY }}
        run: ./release.sh "${{ steps.version.outputs.value }}"

      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs build/Perch.app/Contents/MacOS/Perch)
          echo "architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "::error::missing arm64 slice"; exit 1 ;;
          esac
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "::error::missing x86_64 slice"; exit 1 ;;
          esac

      # build.sh falls back to an ad-hoc signature when it cannot find the
      # identity, which is the right call for a local build but disastrous for a
      # release: an ad-hoc designated requirement pins the cdhash, so every
      # published build revokes the Accessibility grant of the one before it,
      # while System Settings still shows the toggle on because that list is
      # keyed by bundle path. That is invisible in a green build log, so check.
      - name: Verify signature
        if: steps.signing.outputs.available == 'true'
        run: |
          codesign --verify --deep --strict build/Perch.app

          if codesign -dv build/Perch.app 2>&1 | grep -q adhoc; then
            echo "::error::signed ad-hoc despite a signing certificate being configured"
            exit 1
          fi

          REQ="$(codesign -d -r- build/Perch.app 2>&1 | grep '^designated')"
          echo "$REQ"
          case "$REQ" in
            *"certificate leaf"*) ;;
            *) echo "::error::designated requirement does not pin the certificate: $REQ"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Perch-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(mktemp)"

          # Lift this version's section out of CHANGELOG.md: everything between
          # its heading and the next one. A tag with no entry still publishes,
          # just without a "What changed" block — a missing changelog entry is
          # not worth failing a release that has already been built.
          awk -v want="## ${GITHUB_REF_NAME#v}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section

          if [ -s /tmp/changelog-section ]; then
            echo "## What changed" >> "$NOTES"
            cat /tmp/changelog-section >> "$NOTES"
          else
            echo "::warning::no CHANGELOG.md entry for ${GITHUB_REF_NAME#v}"
          fi

          cat >> "$NOTES" <<'EOF'
          ## Install

          1. Download the `.dmg` below and drag **Perch** to Applications.
          2. **Right-click** Perch ▸ **Open** ▸ **Open**. Gatekeeper blocks the
             first launch because Perch is not signed with a paid Apple
             Developer ID. Once per install, not once per launch.
          3. Grant Accessibility access when prompted — System Settings ▸
             Privacy & Security ▸ Accessibility.

          ## Updating

          Drag the new build over the old one. Your Accessibility grant carries
          over, because releases are signed with a stable certificate and the
          requirement stored with the grant pins that certificate.

          **Coming from 1.2.1 or earlier?** Those builds were signed ad-hoc,
          which pins the code hash instead — so each one invalidated the
          previous grant and left a dead entry behind, while System Settings
          kept showing the toggle on. Toggling it does not rebind the stored
          requirement. Clear them once:

          ```
          osascript -e 'quit app "Perch"'
          tccutil reset Accessibility com.zhanli.perch
          open /Applications/Perch.app
          ```

          Then re-tick Perch in Accessibility. Needed once; updates after this
          keep the grant.

          Requires macOS 13 or later. Universal — Apple Silicon and Intel.
          EOF

          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Perch $GITHUB_REF_NAME" \
            --notes-file "$NOTES"
